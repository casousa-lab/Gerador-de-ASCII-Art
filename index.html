<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Imagem para ASCII Art</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg">
    <style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#000000"/>
  <text x="10" y="42" font-family="'Courier New', monospace" font-size="32" font-weight="bold" fill="#00ff00">#@</text>
</svg>
</head>
<body>
    <div class="container">
        <h1>Gerador de ASCII Art</h1>
        <p>Escolha uma imagem para transformar em texto:</p>
        <label id="dropzone"> <input type="file" id="inputImagem">
        <h3>Solte uma imagem ou clique para procurar</h3></label>
        <pre id="telaAscii">A sua arte aparecerá aqui...</pre>
        <button id="btnBaixar" style="display: none; margin-top: 15px; padding: 10px 20px; background-color: #ffffff; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Baixar como TXT</button>
    </div>
</body>
<script src="script.js"></script>
</html>
